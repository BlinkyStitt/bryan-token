[lint]
exclude_lints = ["mixed-case-function"]

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague"
bytecode_hash = "none"
cbor_metadata = false
always_use_create_2_factory = true
optimizer = true
optimizer_runs = 2000
via_ir = true

remappings = [
    "@uniswap/v4-core/=lib/uniswap-hooks/lib/v4-periphery/lib/v4-core/",
    "@uniswap/v4-periphery/=lib/uniswap-hooks/lib/v4-periphery/",
    "@uniswap/universal-router/=lib/universal-router/"
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
